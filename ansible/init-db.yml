- hosts: localhost
  vars:
    db_name: "warehouse"
    db_user: "root"
    db_pass: "12345"
    warehouse_name: "{{ name | default('default') }}"

  tasks:

    - name: Wait for MySQL container to be ready
      shell: |
        until docker exec mysql_{{ warehouse_name }} mysqladmin ping -h 127.0.0.1 -u{{ db_user }} -p{{ db_pass }} --silent; do
          sleep 2
        done

    - name: Create products table
      shell: >
        docker exec mysql_{{ warehouse_name }}
        mysql -h 127.0.0.1 -u{{ db_user }} -p{{ db_pass }} -D {{ db_name }}
        -e "CREATE TABLE IF NOT EXISTS products (
          id INT AUTO_INCREMENT PRIMARY KEY,
          name VARCHAR(100),
          quantity INT,
          price DECIMAL(10,2)
          );"